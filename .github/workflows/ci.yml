name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies from lockfile
        run: uv sync --dev --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run automated test suite
        run: uv run pytest -q

      - name: Compile python source
        run: uv run python -m compileall -q src

      - name: Build package
        run: uv build

      - name: CLI smoke check (--help)
        run: uv run cmdstore --help

      - name: CLI smoke check (--version)
        run: uv run cmdstore --version
